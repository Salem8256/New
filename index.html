<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Town Builder: The Migration Economy Game</title>
<style>
:root{--bg:#fff8ec;--ink:#2b2340;--card:#fff;--mut:#6b6480;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1930;--ink:#f6efe0;--card:#2a2445;--mut:#b6aed0}}
:root[data-theme="dark"]{--bg:#1d1930;--ink:#f6efe0;--card:#2a2445;--mut:#b6aed0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;padding:12px;display:flex;justify-content:center}
#app{width:100%;max-width:720px}h1{font-size:1.3rem;margin:4px 0}h2{margin:6px 0}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0;animation:pop .3s}
button{font:inherit;font-weight:700;border:2px solid #2b2340;border-radius:10px;background:#ffd166;color:#2b2340;padding:10px 14px;cursor:pointer;margin:4px 0}
button.o{display:block;width:100%;text-align:left;background:#8ecae6}button.sel{background:#06d6a0;transform:scale(1.02)}button:disabled{opacity:.5}
input{font:inherit;padding:8px;width:100%;border-radius:8px;border:2px solid var(--mut)}
.why{background:#0001;border-radius:8px;padding:8px;margin:6px 0;font-size:.9rem}.m{color:var(--mut);font-size:.85rem}
.town{position:relative;background:#0002;border-radius:10px;height:30px;overflow:hidden;margin:6px 0}.town i{display:block;height:100%;border-radius:10px;transition:width 1s,background .6s}
.town b{position:absolute;top:0;bottom:0;width:3px;background:#2b2340}.town span{position:absolute;right:8px;top:4px;font-weight:800;color:#2b2340}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;margin:2px;font-weight:700;background:#b8e0a5;color:#2b2340}.chip.neg{background:#ffadad}
table{width:100%;border-collapse:collapse}td,th{padding:4px;text-align:left;border-bottom:1px solid #0002}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;animation:fall 2s ease-in forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script>
const FIREBASE_URL="https://bridgeway-class-default-rtdb.firebaseio.com";
const Q=new URLSearchParams(location.search),HOST=Q.get("view")=="host",CODE=(Q.get("game")||"TOWN").toUpperCase().replace(/[^A-Z0-9_-]/g,"")||"TOWN",B=`${FIREBASE_URL}/town/${CODE}`,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const put=(p,v)=>fetch(`${B}/${p}.json`,{method:v===null?"DELETE":"PUT",body:JSON.stringify(v)}).catch(()=>{});
/* Three choices every round. Town effect and personal points are the same each round. */
const TF=[[1.2,.4,-2],[1.2,.4,-1.2],[1.2,.4,-2.5],[1.8,.4,-1.5],[1.5,0,-2.5],[1.2,.4,-2]],PP=[[3,3.5,7],[3,3.5,6],[3,3.5,8],[3,4,7],[2.5,3,7],[3,3.5,7]],H0=50,GOAL=60,SY=["🏘️","⚖️","💰"],SN=["Invest in the town","Balanced","Chase personal gain"];
const RD=[
{t:"🧑‍🏭 Labor markets",s:"The clinic and the factory can't find enough workers.",o:[["Fill a shortage job and train a coworker","Fills gaps, raises output and taxes, and builds skills for everyone."],["Take a steady job in your field","A solid choice: you earn, and the town benefits a little."],["Take cash-in-hand work with no taxes or training","More money now, but unreported work skips the taxes and training that pay for services."]]},
{t:"💸 Remittances",s:"Families back home need money, and local savings could also fund new shops here.",o:[["Save part in the local credit union, send the rest home","Remittances help families, and local savings can fund new businesses."],["Send most of your pay home through a low-fee service","Remittances pay for food, school and health care back home. Fees take a cut, so low fees matter."],["Charge neighbors steep fees to cash their checks","You profit, but neighbors lose a share of money they need."]]},
{t:"🧠 Brain drain/gain",s:"Skilled workers keep getting offers from abroad, and the town clinic is short-staffed.",o:[["Mentor local apprentices before any move","Sharing skills spreads know-how: brain gain for everyone you teach."],["Keep working in your trained field","Your skills get used, and the town benefits a little."],["Take the highest offer abroad and leave the clinic short","When skilled workers leave, places can lose doctors and teachers: brain drain."]]},
{t:"🌍 Contribution",s:"A new market street could bring jobs and customers, if people invest in it.",o:[["Open a stall that hires a neighbor","Migrant-founded businesses create jobs and pay taxes."],["Work shifts at an existing shop","Steady work adds to local spending."],["Undercut neighbors' stalls to take their customers","Competition can be healthy, but pushing neighbors out shrinks local business."]]},
{t:"⚡ Shock: recession",s:"A recession hits and work hours get cut across town.",o:[["Share hours and help neighbors cover rent","Mutual support keeps people in town and spending."],["Cut spending and wait it out","Safe for you, but a slow recovery for everyone."],["Hoard supplies and raise prices","You gain now, but it deepens the shock for neighbors."]]},
{t:"🏫 Public services",s:"The school and clinic are funded only by what residents contribute.",o:[["Volunteer and pay every tax and fee","Services are funded by everyone paying in. Whether migrants are a net fiscal gain depends on age, skills, work and policy."],["Pay what you owe and keep your free time","You do your part, and the services keep running."],["Dodge taxes and fees where you can","Your gain is paid for by thinner services for everyone."]]}];
const QD=[["When migrants bring different skills, wages for local workers on average usually…",["fall sharply","stay about the same or rise","disappear"],1,"When skills complement each other, output grows and the average wage effect on locals is small or positive."],
["The global target for the average cost of sending remittances is about…",["3%","10%","20%"],0,"Fees now average about 6%, so reaching the 3% target would leave more money for families."],
["Brain gain happens when…",["a country loses all its graduates","workers stop learning","skills, savings or ideas flow back home"],2,"Returnees, mentors and diaspora networks can turn brain drain into brain gain."],
["Which is a way migrants contribute to local economies?",["only by sending money abroad","paying taxes, starting businesses and spending locally","they never create jobs"],1,"Migrants work, pay taxes, start businesses and spend money in the local economy."],
["After a crisis or disaster at home, remittances often…",["rise, like private insurance","fall to zero","never change"],0,"Remittances often rise after disasters, helping families cope."],
["Whether migrants are a net fiscal gain depends on…",["nothing: it is always negative","nothing: it is always positive","age, skills, employment and policy"],2,"There is no single answer: it depends on who migrates, whether they work, and the policy."]];
const AB=[["🏘️","Booster","Your 🏘️ choice counts double for the town"],["💸","Double","Your points from your choice are doubled"],["🛡️","Shield","The town penalty of your choice is halved"]],AR=[0,1,2,0,2,1],QT=20;
let ST={r:0,p:"wait"},DEC=[],QZ=[],AX=[],QS={},QH=0,PL={},ID=null,nm="",sig="",err="",JT=0,done=0;
try{const v=localStorage.getItem("pid"+CODE);if(v)ID=v}catch(e){}
const UP=()=>ST.p=="play"||ST.p=="wait"||ST.p=="quiz"?ST.r:ST.r+1;
/* Everyone computes the same results from the same saved choices. */
function calc(){const ids=Object.keys(PL),N=Math.max(ids.length,1),pers={},cnt=[],hs=[H0],hero={},qp={},inv={};let H=H0;ids.forEach(i=>{pers[i]=0;hero[i]=0;qp[i]=0;inv[i]=[0,0,0]});
for(let k=0;k<UP();k++){const d=DEC[k]||{},qa=QZ[k]||{},ax=AX[k]||{},c=[0,0,0];let sum=0;
ids.filter(i=>qa[i]&&qa[i].a==QD[k][2]).sort((a,b)=>qa[a].t-qa[b].t).forEach((i,j)=>{const v=j==0?3:j==1?2:1;pers[i]+=v;qp[i]+=v;inv[i][AR[k]]++});
ids.forEach(i=>{const a=d[i];if(a==null)return;c[a]++;let t=TF[k][a],p=PP[k][a],b=ax[i];if(b!=null&&inv[i][b]>0){inv[i][b]--;if(b==0&&a==0)t*=2;if(b==1)p*=2;if(b==2&&t<0)t/=2}sum+=t;pers[i]+=p;if(a==0)hero[i]++});
H=Math.max(0,Math.min(100,H+sum*14/N));cnt[k]=c;hs[k+1]=H}
const sc=ids.map(i=>({i,n:PL[i].n,p:Math.round(pers[i]*10)/10,h:hero[i],q:qp[i]})).sort((a,b)=>b.p-a.p);return{ids,N,cnt,hs,H,sc,inv}}
const meter=H=>`<div class="town"><i style="width:${H}%;background:${H>=GOAL?"#06d6a0":H>=40?"#ffd166":"#ef476f"}"></i><b style="left:${GOAL}%"></b><span>🏘️ ${Math.round(H)}/100</span></div><div class="m">Goal: reach ${GOAL} by the end of round 6</div>`;
const fx=(k,a)=>`<span class="m">Town ${TF[k][a]>0?"+":""}${TF[k][a]} · You +${PP[k][a]}</span>`;
function fin(){const c=calc(),ok=c.H>=GOAL,hero=c.sc.slice().sort((a,b)=>b.h-a.h)[0],tw=c.sc.slice().sort((a,b)=>b.q-a.q)[0];if(!c.sc.length)return"";
return`<div class="card"><h2>🏁 Final results</h2>${meter(c.H)}<div class="why">${ok?`🎉 <b>The town reached its goal!</b> The winner is the player with the most personal points.`:`🌧️ <b>The town missed its goal, so everyone loses.</b> The points below are for discussion only: personal gain can't win when the town fails.`}</div><table><tr><th>#</th><th>Name</th><th>Personal points</th></tr>${c.sc.map((x,i)=>`<tr><td>${ok&&i==0?"🏆":i+1}</td><td>${esc(x.n)}</td><td><b>${x.p}</b></td></tr>`).join("")}</table>${hero.h?`<div class="why">🏘️ <b>Town Hero:</b> ${esc(hero.n)} (invested in the town ${hero.h} times)</div>`:""}${tw.q?`<div class="why">⚡ <b>Trivia Whiz:</b> ${esc(tw.n)} (${tw.q} trivia points)</div>`:""}<h3>Discuss</h3><ol><li>What tempted you to choose 💰? Did anyone regret it?</li><li>How did the group keep the town above its goal, or why did it fail?</li><li>Where in real life do individual gains cost a community (off-the-books work, brain drain, tax avoidance), and where do migrants' contributions help everyone?</li><li>What rules or incentives could keep everyone cooperating without hurting personal wellbeing?</li></ol></div>`}
function confetti(n){const c=["#ffd166","#ef476f","#06d6a0","#118ab2","#cdb4f6"];for(let i=0;i<n;i++){const d=document.createElement("i");d.className="cf";d.style.cssText=`left:${Math.random()*100}%;background:${c[i%5]};animation-delay:${Math.random()*.6}s;animation-duration:${1.6+Math.random()}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}
const RULE=`You and your neighbors are migrant workers settling into the town of Bridgeport. Each round, choose 🏘️ invest in the town, ⚖️ stay balanced, or 💰 chase personal gain. 💰 earns you the most points but <b>lowers the town's health for everyone</b>. The player with the most personal points wins, but <b>only if the town reaches its goal of ${GOAL}</b>. If it doesn't, <b>everyone loses</b>. Collaborate! Each round starts with ⚡ trivia: fast correct answers earn bonus points and unlock one-time ability cards: 🏘️ Booster, 💸 Double, 🛡️ Shield.`;
function revealH(c,k,me){const n=c.cnt[k],dh=c.hs[k+1]-c.hs[k],a=(DEC[k]||{})[me];return`<div class="card"><h2>Round ${k+1} results</h2><div>${[0,1,2].map(i=>`<span class="chip ${i==2?"neg":""}">${SY[i]} ${n[i]}</span>`).join("")} <span class="chip ${dh<0?"neg":""}">Town ${dh>0?"+":""}${dh.toFixed(1)}</span></div>${meter(c.hs[k+1])}`+(me&&a!=null?`<div class="why"><b>You chose ${SY[a]}:</b> ${RD[k].o[a][0]}<br>📘 ${RD[k].o[a][1]}<br>You earned <b>+${PP[k][a]*(me&&(AX[k]||{})[me]==1?2:1)}</b> points from your choice.</div>`:"")+`<div class="why">📘 <b>What each choice means:</b><br>${RD[k].o.map((o,i)=>`${SY[i]} ${o[1]}`).join("<br>")}</div></div>`}
function playerH(){const h="<h1>🏘️ Town Builder</h1>"+(err?`<div class="why">${err}</div>`:"");
if(!ID||!PL[ID]){if(ST.p!="wait")return h+'<div class="card">The game has already started. Ask the host to reset it if you want to join.</div>';return h+`<div class="card"><b>Join the town</b><div class="why">${RULE}</div><input id="nm" placeholder="Your name" value="${esc(nm)}" maxlength="20" oninput="nm=this.value"><button data-a="join">Join</button></div>`}
const c=calc(),R=RD[ST.r],mine=c.sc.find(x=>x.i==ID),b=`<div class="card"><b>${esc(PL[ID].n)}</b> · Your points: <b>${mine?mine.p:0}</b>${meter(c.H)}</div>`;
if(ST.p=="wait")return h+b+`<div class="card">⏳ Waiting for the host to start. ${c.N} player${c.N>1?"s":""} joined.<div class="why">${RULE}</div></div>`;
if(ST.p=="quiz"){const q=QD[ST.r],my=(QZ[ST.r]||{})[ID];if(QS[ST.r]==null)QS[ST.r]=Date.now();return h+b+`<div class="card"><h2>⚡ Quick trivia ${ST.r+1}/6</h2><div class="town"><i id="tb" style="width:100%;background:#118ab2;transition:width .5s linear"></i><span id="tm">${QT}</span></div><p><b>${q[0]}</b></p>`+q[1].map((o,i)=>`<button class="o ${my&&my.a===i?"sel":""}" data-a="ans:${i}" ${my?"disabled":""}>${o}</button>`).join("")+`<p class="m">${my?"✅ Answer locked. Waiting for the others…":"Fast correct answers earn the most points and unlock an ability card!"}</p></div>`}
if(ST.p=="play"){const d=DEC[ST.r]||{},a=d[ID],lk=Object.keys(d).length,iv=c.inv[ID].slice(),qk=(QZ[ST.r]||{})[ID],good=qk&&qk.a==QD[ST.r][2],ub=(AX[ST.r]||{})[ID];if(good)iv[AR[ST.r]]++;return h+b+(qk?`<div class="why">${good?"✅ Trivia correct! You earned "+AB[AR[ST.r]][0]+" "+AB[AR[ST.r]][1]+".":"❌ Trivia missed."} 📘 ${QD[ST.r][3]}</div>`:"")+`<div class="card"><h2>Round ${ST.r+1}/6: ${R.t}</h2><p>${R.s}</p>`+R.o.map((o,i)=>`<button class="o ${a===i?"sel":""}" data-a="pick:${i}">${SY[i]} ${o[0]}<br>${fx(ST.r,i)}</button>`).join("")+`<div class="why"><b>Abilities</b> (optional, one per round)<br>`+AB.map((x,j)=>`<button data-a="ab:${j}" class="${ub===j?"sel":""}" ${iv[j]>0?"":"disabled"}>${x[0]} ${x[1]} ×${iv[j]}</button>`).join(" ")+`<br><span class="m">${ub!=null?AB[ub][2]:"Tap an ability to activate it for this round."}</span></div><p class="m">${a==null?"Choose an option.":"✅ Locked in. You can change it until the host reveals."} Locked in: ${lk}/${c.N}</p></div>`}
if(ST.p=="reveal")return h+b+revealH(c,ST.r,ID)+`<p class="m">Waiting for the next round…</p>`;
return h+fin()}
function hostH(){const c=calc(),R=RD[ST.r],d=DEC[ST.r]||{},lk=Object.keys(d).filter(i=>PL[i]).length,an=Object.keys(QZ[ST.r]||{}).filter(i=>PL[i]).length;
let h=`<h1>🏘️ Town Builder: Host screen</h1><p class="m">Game code ${CODE}. Players open the main link (no ?view=host).</p>`+(err?`<div class="why">${err}</div>`:"");
const btn=ST.p=="wait"?`<button data-a="start">▶ Start round 1 (${c.N} joined)</button>`:ST.p=="quiz"?`<button data-a="play">⏭ Close trivia (${an}/${c.N} answered)</button>`:ST.p=="play"?`<button data-a="reveal">👁 Reveal results (${lk}/${c.N} locked in)</button>`:ST.p=="reveal"?(ST.r<5?'<button data-a="next">➡ Next round</button>':'<button data-a="final">🏁 Final results</button>'):"";
h+=`<div class="card">${btn} <button data-a="reset" style="background:#ffadad">🔄 Reset</button>${meter(c.H)}</div>`;
if(ST.p=="wait")return h+`<div class="card"><div class="why">${RULE}</div>Joined: ${c.ids.map(i=>esc(PL[i].n)).join(", ")||"nobody yet"}</div>`;
if(ST.p=="quiz")return h+`<div class="card"><h2>⚡ Trivia ${ST.r+1}/6</h2><p style="font-size:1.3rem"><b>${QD[ST.r][0]}</b></p>${QD[ST.r][1].map(o=>`<div class="why">${o}</div>`).join("")}<div class="town"><i id="tb" style="width:100%;background:#118ab2;transition:width .5s linear"></i><span id="tm">${QT}</span></div><p class="m">Answered: ${an}/${c.N}. Fast correct answers earn bonus points and an ability card.</p></div>`;
if(ST.p=="play")return h+quizRes(c)+`<div class="card"><h2>Round ${ST.r+1}/6: ${R.t}</h2><p style="font-size:1.1rem">${R.s}</p>${R.o.map((o,i)=>`<div class="why">${SY[i]} ${o[0]}<br>${fx(ST.r,i)}</div>`).join("")}<p class="m">Everyone chooses secretly. The town reacts to the combined choices.</p></div>`;
if(ST.p=="reveal")return h+revealH(c,ST.r,null);
return h+fin()}
function quizRes(c){const qa=QZ[ST.r]||{},ok=c.ids.filter(i=>qa[i]&&qa[i].a==QD[ST.r][2]).sort((a,b)=>qa[a].t-qa[b].t);return`<div class="why">⚡ <b>Trivia:</b> ${ok.length}/${c.N} correct. Fastest: ${ok.slice(0,3).map(i=>esc(PL[i].n)+" ("+(qa[i].t/1000).toFixed(1)+"s)").join(", ")||"nobody"}<br>📘 ${QD[ST.r][3]}</div>`}
function setS(r,p){ST={r,p};if(p=="quiz")QH=Date.now();put("state",ST)}
function act(a){const[k,v]=a.split(":");
if(k=="join"){nm=($("#nm")?$("#nm").value:nm).trim().slice(0,20);if(!nm)return;ID="p"+Math.random().toString(36).slice(2,8);JT=Date.now();PL[ID]={n:nm};try{localStorage.setItem("pid"+CODE,ID)}catch(e){}put("pl/"+ID,PL[ID])}
else if(k=="pick"){DEC[ST.r]=DEC[ST.r]||{};DEC[ST.r][ID]=+v;put(`dec/${ST.r}/${ID}`,+v)}
else if(k=="ans"){QZ[ST.r]=QZ[ST.r]||{};if(QZ[ST.r][ID])return;const o={a:+v,t:Date.now()-(QS[ST.r]||Date.now())};QZ[ST.r][ID]=o;put(`qz/${ST.r}/${ID}`,o)}
else if(k=="ab"){const j=+v;AX[ST.r]=AX[ST.r]||{};if(AX[ST.r][ID]===j){delete AX[ST.r][ID];put(`ax/${ST.r}/${ID}`,null)}else{AX[ST.r][ID]=j;put(`ax/${ST.r}/${ID}`,j)}}
else if(k=="start")setS(0,"quiz");else if(k=="play")setS(ST.r,"play");else if(k=="reveal")setS(ST.r,"reveal");else if(k=="next")setS(ST.r+1,"quiz");else if(k=="final")setS(ST.r,"end");
else if(k=="reset"&&confirm("Erase this whole game and start over?")){ST={r:0,p:"wait"};DEC=[];QZ=[];AX=[];PL={};put("",null)}
sig="";draw()}
function draw(){const s=JSON.stringify([ST,DEC,QZ,AX,PL,ID,err]);if(s==sig)return;sig=s;$("#app").innerHTML=HOST?hostH():playerH();document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));if(ST.p=="end"&&!done){done=1;if(calc().H>=GOAL)confetti(80)}if(ST.p!="end")done=0}
async function tick(){try{const o=await(await fetch(B+".json")).json()||{};ST=o.state||{r:0,p:"wait"};DEC=o.dec||[];QZ=o.qz||[];AX=o.ax||[];PL=o.pl||{};if(!HOST&&ID&&!PL[ID]&&Date.now()-JT>6000)ID=null;err="";if(HOST&&ST.p=="quiz"){const an=Object.keys(QZ[ST.r]||{}).filter(i=>PL[i]).length;if(!QH)QH=Date.now();if((an&&an>=Object.keys(PL).length)||Date.now()-QH>(QT+2)*1000)setS(ST.r,"play")}}catch(e){err="⚠️ Can't reach the database. Check your connection."}draw()}
tick();setInterval(tick,2000);
setInterval(()=>{const t=$("#tm");if(t&&ST.p=="quiz"){const s=Math.max(0,QT-Math.floor((Date.now()-(HOST?QH||Date.now():QS[ST.r]||Date.now()))/1000)),b=$("#tb");t.textContent=s;if(b)b.style.width=s/QT*100+"%"}},500);
</script></body></html>
