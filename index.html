/* ---- phones ---- */
function playerH(){const h="<h1>🌍 Roots & Routes Live</h1>"+(err?`<div class="card">${err}</div>`:"");
if(!ID||!PL[ID]){if(ST.p!="wait")return h+'<div class="card">The show has already started. Ask the host to reset it so you can join.</div>';return h+`<div class="card"><h2>Join the show!</h2><input id="nm" placeholder="Your name" value="${esc(nm)}" maxlength="16" oninput="nm=this.value"><p>Pick your character:</p><div class="chars">${[0,1,2,3,4,5,6,7].map(j=>`<button class="cb ${chs==j?"sel2":""}" data-a="chr:${j}">${hero(j,chs==j?"happy":"idle",80)}<small>${CH[j][0]}</small></button>`).join("")}</div><div class="cen"><button data-a="join">🎬 JOIN</button></div></div>`}
const c=calc(),me=PL[ID],g=GRP[ID],mates=g!=null?c.gm[g]||[]:[],rk=mates.slice().sort((a,b)=>c.sc[b]-c.sc[a]).indexOf(ID)+1,S=STEPS[ST.n],G=(c.G[ST.n]||{})[ID];
const mood=ST.p=="r"&&G?(G.o?"happy":G.has?"sad":"wow"):ST.p=="q"?"think":"idle";
const top=`<div class="card row">${hero(me.ch,mood,90)}<div><b style="font-size:1.2rem">${esc(me.n)}</b><div style="font-size:1.6rem;font-weight:900">${c.sc[ID]} pts</div><small>${g!=null?`${gdot(g)} Group ${gl(g)} · you're #${rk} of ${mates.length}`:"Waiting for groups…"}${c.fl?(c.fl.includes(ID)?" · ⭐ FINALIST":ST.n>=16?" · 🎟 Audience":""):""}</small></div></div>`;
if(ST.p=="wait")return h+top+`<div class="card cen"><b>You're in! 🎉</b><p>Waiting for the host to start. You'll be placed in a random group of 3–4 players.</p><div class="row">${Object.keys(PL).map(i=>face(PL[i].ch,"happy",40)).join("")}</div></div>`;
if(ST.pa)return h+top+'<div class="card cen"><h2>⏸ Paused</h2></div>';
const RNn=RN[S?S.r:0];
if(ST.p=="intro")return h+top+bar(`Round ${S.r+1}: <b>${RNn[1]}</b>!`)+`<div class="card" style="border-color:${RNn[2]}"><h2>${RNn[0]} Round ${S.r+1}: ${RNn[1]}</h2><p style="font-size:1.1rem">${S.r==5?(c.fl&&c.fl.includes(ID)?"🎉 <b>YOU'RE A FINALIST!</b> "+RNn[3]:"You didn't make the finale, but you're in the <b>audience</b>! Predict which finalist wins each question: every right prediction earns <b>100 audience points</b> toward the <b>Audience Prize</b>."):RNn[3]}</p>${S.r==5&&c.fl?`<h3>The finalists</h3><div class="row">${c.fl.map(i=>`<div class="cen">${hero(PL[i].ch,"happy",70)}<small>${esc(PL[i].n)}</small></div>`).join("")}</div>`:""}</div>`;
if(ST.p=="wheel")return h+top+bar("Spin the wheel!")+`<div class="cen">${wheelSVG()}</div>`;
if(ST.p=="pick"){const mine=S.k=="pick"?(PK[ST.n]||{})[ID]:(CHL[ST.n]||{})[ID];
if(S.k=="pick")return h+top+`<div class="card"><h2>🎯 Pick your question</h2>${mine?`<p>✅ Locked in: ${CATS[mine.c][0]} ${CATS[mine.c][1]} · ${"⭐".repeat(mine.d)}${mine.r?" · 🎲 RISK":""}</p>`:`<div class="pbtn">${CATS.map((x,i)=>`<button data-a="pkc:${i}" style="background:${x[2]}" class="${PKL.c==i?"sel2":""}">${x[0]} ${x[1]}</button>`).join("")}</div><div class="pbtn">${[1,2,3].map(d=>`<button data-a="pkd:${d}" class="${PKL.d==d?"sel2":""}">${"⭐".repeat(d)} ${100*d}</button>`).join("")}</div><div class="pbtn"><button data-a="pkr:0" class="${!PKL.r?"sel2":""}">🛡️ Safe (wrong = −half)</button><button data-a="pkr:1" class="${PKL.r?"sel2":""}" style="background:#ef476f;color:#fff">🎲 RISK (double or lose all)</button></div><div class="cen"><button data-a="pkok" ${PKL.c!=null&&PKL.d!=null?"":"disabled"}>🔒 LOCK IN</button></div>`}</div>`;
return h+top+`<div class="card"><h2>⚔️ Challenge a player in your group?</h2>${mine?`<p>✅ ${mine=="-"?"You'll play it safe.":"You challenged "+esc((PL[mine]||{n:"?"}).n)+"!"}</p>`:`<div class="pbtn">${mates.filter(i=>i!=ID).map(i=>`<button data-a="chl:${i}" style="background:${GC[g%GC.length]}">⚔️ ${esc(PL[i].n)} (${c.sc[i]})</button>`).join("")}<button data-a="chl:-">Play it safe</button></div>`}</div>`}
if(ST.p=="q"&&(S.k=="fin"||S.k=="tb")&&!(S.k=="tb"?c.tie:c.fl).includes(ID)){const part=S.k=="tb"?c.tie:c.fl,q=mk((QSP[ST.n]||{}).qi),pr=(AUD[ST.n]||{})[ID];return h+top+`<div class="card"><div class="qtag" style="background:#ffd700">🎟 AUDIENCE · predict the winner</div><div class="q">${esc(q.q)}</div><p>Who will win this question? (+100 audience points if you're right)</p><div class="pbtn">${part.map(i=>`<button data-a="pred:${i}" class="${pr==i?"sel2":""}" ${pr?"disabled":""}>${face(PL[i].ch,"idle",40)} ${esc(PL[i].n)} (${c.fsc[i]})</button>`).join("")}</div>${pr?"<p>✅ Prediction locked!</p>":""}</div>`}
if(ST.p=="q"){const q=curQ(ST.n),a=(ANS[ST.n]||{})[ID];if(TQ[ST.n]==null)TQ[ST.n]=Date.now()+(S.k=="fast"?2800*TS:0);const rdy=Date.now()<TQ[ST.n],pk=S.k=="pick"?((PK[ST.n]||{})[ID]||{c:hs(ID+ST.n)%6,d:1,r:0}):null,cat=CATS[q.c];
return h+top+`<div class="card"><div class="qtag" style="background:${cat[2]}">${cat[0]} ${cat[1]}${pk?` · ${100*pk.d*(pk.r?2:1)} pts${pk.r?" · 🎲 RISK":""}`:""}${S.k=="fin"?" · 👑 FINALE · "+FB[S.i]+" pts":S.k=="tb"?" · 👑 TIEBREAKER":""}${q.m?" · ☑ SELECT ALL":""}${S.k=="chal"&&(CHL[ST.n]||{})[ID]&&(CHL[ST.n]||{})[ID]!="-"?" · ⚔️ vs "+esc((PL[(CHL[ST.n]||{})[ID]]||{n:"?"}).n):""}</div><div class="qrow"><div class="q">${esc(q.q)}</div>${ring(20)}</div><div id="rdy" class="big" style="font-size:3rem;${rdy?"":"display:none"}">Get ready…</div>${qOpts(q,rdy,SELS,!!a)}${q.m&&!a?'<div class="cen"><button data-a="lock">🔒 LOCK IN</button></div>':""}${a?"<p>✅ Answer locked! Waiting for the others…</p>":""}</div>`}
if(ST.p=="r"&&(S.k=="fin"||S.k=="tb")){const q=mk((QSP[ST.n]||{}).qi),st=c.fl.slice().sort((a,b)=>c.fsc[b]-c.fsc[a]),res=G?(G.aud?(G.pr==null?"⏳ No prediction":G.ok?"✅ Great prediction! +100":"❌ Not this time"):(G.o?"✅ Correct! +"+G.p:G.has?"❌ Wrong "+G.p:"⏰ No answer")):"👀 You watched this one";return h+top+bar(G&&(G.aud?G.ok:G.o)?say(["Brilliant!","That's the one!"]):say(["Ouch!","So close!"]),G&&(G.aud?G.ok:G.o)?"talk":"wow")+`<div class="card ${G&&(G.aud?G.ok:G.o)?"":"hit"}"><h2>${res}</h2><div class="why" style="background:#0003;padding:8px;border-radius:8px">Answer: <b>${esc(q.ks.map(k=>q.o[k]).join(" + "))}</b><br>📘 ${esc(q.e)}</div><h3>👑 Finale standings</h3>${st.map((i,k)=>`<div class="lrow" style="${i==ID?"background:#ffd16644;border-radius:8px":""}"><b>${k+1}</b>${face(PL[i].ch,"idle",30)}<span>${esc(PL[i].n)}</span><b>${c.fsc[i]}</b></div>`).join("")}${c.fl.includes(ID)?"":`<p>🎟 Your audience points: <b>${c.asc[ID]||0}</b></p>`}</div>`}
if(ST.p=="r"){const q=G&&G.qq||mk((QSP[ST.n]||{}).qi);return h+top+bar(G&&G.o?say(["Correct! The crowd goes wild!","That's the one!","Brilliant!"]):say(["Oof, not this time!","So close!","Ouch!"]),G&&G.o?"talk":"wow")+`<div class="card ${G&&G.o?"":"hit"}"><h2>${G&&G.o?"✅ Correct!":G&&G.has?"❌ Not quite":"⏰ No answer"} ${G?(G.p>=0?"+":"")+G.p:""}</h2>${G&&G.fa?"<p>⚡ Fastest in your group: +100!</p>":""}${G&&G.ch=="won"?"<p>⚔️ You won your challenge!</p>":G&&G.ch=="lost"?"<p>⚔️ You lost points in a challenge.</p>":""}<div class="why" style="background:#0003;padding:8px;border-radius:8px">Answer: <b>${esc(q.ks.map(k=>q.o[k]).join(" + "))}</b><br>📘 ${esc(q.e)}</div><h3>Your group</h3>${grpTable(c,g,ID)}</div>`}
if(ST.p=="end"){const fin=!!(c.fl&&ST.n>=16),t1=fin?Math.max(...c.fl.map(i=>c.fsc[i])):0,champs=fin?c.fl.filter(i=>c.fsc[i]==t1):[c.ids.slice().sort((a,b)=>c.sc[b]-c.sc[a])[0]],aud=fin?c.ids.filter(i=>!c.fl.includes(i)).sort((a,b)=>(c.asc[b]||0)-(c.asc[a]||0))[0]:null,bgs=c.ids.slice().sort((a,b)=>c.sc[b]-c.sc[a])[0],iAm=champs.includes(ID);
return h+top+`<div class="card cen"><h1>${iAm?"🏆 YOU ARE THE CHAMPION!":"🏁 Game over"}</h1><div class="row">${champs.map(i=>`<div class="cen">${hero(PL[i].ch,"win",iAm?170:120)}<h2>${esc(PL[i].n)}</h2></div>`).join("")}</div><p>${champs.length>1?"Co-champions · ":""}${fin?"👑 Grand Finale champion":"Group-stage champion"}</p></div><div class="card"><h3>🏅 Prizes</h3><p>⭐ Best group stage: <b>${esc(PL[bgs].n)}</b> (${c.sc[bgs]})</p>${aud&&(c.asc[aud]||0)>0?`<p>🎟 Audience Prize: <b>${esc(PL[aud].n)}</b> (${c.asc[aud]} pts)</p>`:""}<p>Your group stage: ${c.sc[ID]} pts</p><h3>Your group</h3>${grpTable(c,g,ID)}</div>`}
const L=c.ids.slice().sort((a,b)=>c.sc[b]-c.sc[a]),ov=L.indexOf(ID)+1,champ=mates.slice().sort((a,b)=>c.sc[b]-c.sc[a])[0]==ID;
return h+top+`<div class="card cen"><h1>${champ?"🏆 You won your group!":"🏁 Game over"}</h1>${hero(me.ch,champ?"win":"idle",150)}<h2>#${ov} of ${L.length} overall · #${rk} in Group ${g!=null?gl(g):"-"}</h2></div><div class="card"><h3>Your group</h3>${grpTable(c,g,ID)}</div>`}
/* ---- admin screen ---- */
function hostH(){const c=calc(),np=c.ids.length,S=STEPS[Math.min(ST.n,STEPS.length-1)],L=c.ids.slice().sort((a,b)=>c.sc[b]-c.sc[a]),mx=Math.max(1,c.sc[L[0]]||1),run=ST.p!="wait"&&ST.p!="end",fin=ST.p=="end";
const st=ST.p=="wait"?`Waiting to start · ${np} joined · game code ${CODE}`:fin?"🏁 Game finished":`${ST.pa?"⏸ PAUSED · ":""}${S.k=="tb"?"Round 6 · Sudden-death tiebreaker":`Round ${S.r+1} of 6 · Question ${ST.n+1} of ${STEPS.length-3}`}`;
const ctl=`<div class="ctl">${ST.p=="wait"?`<button data-a="start" ${np?"":"disabled"} style="font-size:1.3rem">▶ START GAME</button>`:run?`<button data-a="pause">${ST.pa?"▶ Resume":"⏸ Pause"}</button><button data-a="stop" style="background:#ff8fa3">⏹ STOP GAME</button>`:""}<button data-a="reset" style="background:#ffadad">🔄 Reset</button></div>`;
const gc=Object.keys(c.gm).map(g=>{const m=c.gm[g].slice().sort((a,b)=>c.sc[b]-c.sc[a]);return`<div class="card" style="border-color:${GC[g%GC.length]};margin:6px 0"><b>${gdot(+g)} Group ${gl(+g)}</b>${m.map((i,k)=>`<div class="lrow">${k==0&&fin&&c.sc[i]>0?"🏅":`<b style="min-width:20px">${k+1}</b>`}${face(PL[i].ch,"idle",28)}<span>${esc(PL[i].n)}</span><b>${c.sc[i]}</b></div>`).join("")}</div>`}).join("");
const fp=c.fl&&ST.n>=16?`<div class="card" style="border-color:#ffd700"><h2>👑 Grand Finale</h2>${c.fl.slice().sort((a,b)=>c.fsc[b]-c.fsc[a]).map((i,k)=>`<div class="lrow"><b style="min-width:22px">${fin&&k==0?"🏆":k+1}</b>${face(PL[i].ch,"idle",34)}<span>${esc(PL[i].n)}</span><b>${c.fsc[i]}</b></div>`).join("")}<h3>🎟 Audience Prize</h3>${c.ids.filter(i=>!c.fl.includes(i)).sort((a,b)=>c.asc[b]-c.asc[a]).slice(0,3).map(i=>`<div class="lrow">${face(PL[i].ch,"idle",26)}<span>${esc(PL[i].n)}</span><b>${c.asc[i]}</b></div>`).join("")||"<small>No audience yet</small>"}</div>`:"";
return`${err?`<div class="card">${err}</div>`:""}<h1>📊 Live leaderboard</h1><p style="text-align:center;font-weight:800;font-size:1.1rem">${st}</p>${ctl}<div class="lbwrap"><div class="card"><h2>All players</h2>${L.map((i,k)=>`<div class="lb"><b style="width:46px">${k+1}${k==0&&c.sc[i]>0?"👑":""}</b>${face(PL[i].ch,"idle",36)}<span>${esc(PL[i].n)} ${gdot(GRP[i])}${c.fl&&c.fl.includes(i)?" ⭐":""}</span><i style="width:${Math.max(2,c.sc[i]/mx*38)}%"></i><b style="min-width:70px;text-align:right">${c.sc[i]}</b></div>`).join("")||"<p style='text-align:center'>Waiting for players to join…</p>"}</div><div>${fp}<h2>Groups</h2>${gc||"<p style='text-align:center'>Groups appear when the game starts.</p>"}</div></div>`}
/* ---- rendering loop ---- */
function draw(f){const s=JSON.stringify([ST,PL,GRP,QSP,ANS,PK,CHL,AUD,ID,err,chs,PKL,[...SELS],nm&&0]);if(s==sig&&!f)return;sig=s;const was=$("#nm")?$("#nm").value:null;$("#app").innerHTML=HOST?hostH():playerH();if(was!=null&&$("#nm"))$("#nm").value=was;
const k=ST.n+ST.p;
if(!HOST&&ST.p=="intro"&&SPL!=ST.n){SPL=ST.n;const S=STEPS[ST.n],r=RN[S.r];splash(r[0],r[1],r[2])}
if(!HOST&&ST.p=="wheel"&&SPUN!=ST.n){SPUN=ST.n;const t=(QSP[ST.n]||{}).c;setTimeout(async()=>{await spinTo(t);const sg=$("#sg"+t);if(sg)sg.classList.add("seg-win");seq([784,988,1175,1568],"square");await W(700);splash(CATS[t][0],CATS[t][1],CATS[t][2])},50)}
if(ST.p=="r"&&LK2!=k){LK2=k;const c=calc(),G=(c.G[ST.n]||{})[ID];if(!HOST&&G){(G.aud?G.ok:G.o)?(good(),confetti(25)):bad()}}
if(ST.p=="q"&&LK3!=k){LK3=k;if(!HOST)seq([520,660],"triangle")}
if(ST.p=="end"&&!done){done=1;if(!HOST){fan();confetti(150)}}if(ST.p!="end")done=0}
let LK2="",LK3="";
const arr=x=>{if(Array.isArray(x))return x;const a=[];for(const k in x||{})a[+k]=x[k];return a};
async function tick(){try{const o=await(await fetch(B+".json")).json()||{};ST=o.state||{n:0,p:"wait"};PL=o.pl||{};GRP=o.grp||{};QSP=arr(o.qs);QSP.forEach(x=>{if(x&&x.c<0)x.c=null});ANS=arr(o.ans);PK=arr(o.pk);CHL=arr(o.chl);AUD=arr(o.aud);if(!HOST&&ID&&!PL[ID]&&Date.now()-JT>6000)ID=null;err=""}catch(e){err="⚠️ Can't reach the database. Check your connection."}draw()}
tick();setInterval(tick,1500*TS);setInterval(hostLoop,400*TS);
setInterval(()=>{const t=$("#tm");if(!t||ST.p=="wait")return;const S=STEPS[ST.n];let lim,el;if(HOST){lim=DUR()/TS/1000;el=(Date.now()-PH0)/TS/1000}else if(ST.p=="q"){lim=20;el=(Date.now()-(TQ[ST.n]||Date.now()))/TS/1000;const rd=$("#rdy"),r2=Date.now()<(TQ[ST.n]||0);if(rd&&!r2){rd.style.display="none";document.querySelectorAll(".op").forEach(b=>{if(!(ANS[ST.n]||{})[ID])b.disabled=false})}}else return;const s=Math.max(0,Math.ceil(lim-el)),b=$("#tb");t.textContent=s;if(b){b.style.strokeDashoffset=113*(1-s/lim);b.style.stroke=s<=5?"#ef476f":"#ffd166"}if(!HOST&&s<=5&&s>0&&ST.p=="q")snd(900,.05,"square",.1)},250*TS);
</script></body></html>
