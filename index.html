const hs=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1679616;return h.toString(36)};
function seed(s){let h=1779033703;for(const c of s)h=Math.imul(h^c.charCodeAt(0),3432918353)<<13|h>>>19;let a=h>>>0;rnd=()=>{a=a+1831565813|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const QZ={3:["💸 Remittances","What do remittances mostly help families pay for?",["Nothing, they have no effect","Only big factories","Food, school and health care"],2,"Remittances mostly go to household needs like food, schooling and health care, which can reduce poverty. Fees take a cut, and families can come to depend on them.","R"],
5:["🧑‍🏭 Labor markets","When migrants and local workers have different skills, what usually happens to local wages on average?",["They fall sharply","They stay about the same or rise","Everyone loses their job"],1,"When skills complement each other, output grows and the average wage effect on locals is small or positive. Workers in very similar jobs can feel short-run pressure.","L"],
7:["🧠 Brain drain/gain","Which is an example of brain GAIN for a home country?",["A returnee opens a clinic using skills learned abroad","Doctors leave and never return","Fewer students choose medicine"],0,"Brain gain happens when skills, savings and ideas flow back home through returnees, mentoring and diaspora networks.","B"],
9:["🌍 Contribution","How do migrants contribute to economies?",["They don't contribute","By working, paying taxes, starting businesses and spending","Only by sending money home"],1,"Migrants fill jobs, pay taxes, start businesses and buy goods, both where they live and through links back home. Net effects depend on skills, age, work and policy.","G"]};
const HOW=`<h2>🌉 Bridgeway</h2><b>Economic Impacts of Migration</b><div class="why"><b>🎯 What you will learn</b><br>💸 Remittances: money sent home and what it does<br>🧑‍🏭 Labor markets: how migrant workers affect jobs and wages<br>🧠 Brain drain/gain: what happens to skills when people leave or return<br>🌍 Contribution: how migrants build local and global economies</div><div class="why"><b>📖 Your story</b><br>You are a migrant worker who just arrived in a new city. Your family back home counts on you. Every choice has costs and benefits for you, your family, and both countries.</div><div class="why"><b>🕹️ How to play</b><br>1. Roll the dice and move.<br>2. Pick an option on the tile you land on.<br>3. Read the 📘 note to see why it matters.<br>4. Answer quick quiz questions along the way.<br>The 💸🧑‍🏭🧠🌍 numbers on your card show the community impact you built in each topic.</div><div class="why"><b>🏆 How you win</b><br>Score = 💰 cash ÷ 100 + ❤️ community points. You need both! Everyone gets the same dice and events, so only your choices make the difference. Ranks: Newcomer, Settler, Community Builder, Bridge Builder.</div>`;
function help(){modal(HOW+'<button id="cl">Close</button>');$("#cl").onclick=close}
function intro(){modal(HOW+`<p>Your name or team: <input id="nm" maxlength="20" style="width:100%;padding:8px"></p><p>Game code from your host: <input id="gc" value="${esc(code)}" maxlength="12" style="width:100%;padding:8px"></p><button id="go">Start game</button> <button id="hb">Leaderboard</button>`);$("#go").onclick=()=>{pname=$("#nm").value.trim().slice(0,20)||"Player";code=$("#gc").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"")||"BRIDGE";seed(code);close();init();begin()};$("#hb").onclick=board}
function render(){const b=$("#board");b.innerHTML=T.map((t,i)=>{const[r,c]=xy(i);return`<div class="t" style="grid-row:${r};grid-column:${c};background:${t[3]}"><b>${t[2]}</b>${t[0]}<span class="tk">${P.filter(p=>p.pos==i).map(p=>p.tok).join("")}</span></div>`}).join("")+`<div id="mid"><b>Round ${Math.min(P[cur].turns+1,R)} of ${R}</b><span>${P[cur].tok} <b>${P[cur].name}</b>'s turn</span><small>🎯 Goal: 40+ points = Bridge Builder</small><div id="dice">🎲</div><button id="roll" ${busy?"disabled":""}>Roll dice</button></div>`;$("#roll").onclick=roll;
$("#sc").innerHTML=P.map((p,i)=>`<div class="pc ${i==cur?"on":""}"><h3>${p.tok} ${p.name}</h3><div class="big">💰 $${p.cash}</div><div class="big">❤️ ${p.comm} community</div>Skill ${p.skill}/3 · Shops ${p.biz}<br>💸${p.k.R} 🧑‍🏭${p.k.L} 🧠${p.k.B} 🌍${p.k.G}<br><b>Score ${sc(p)}</b></div>`).join("")}
function modal(h){$("#md").innerHTML=h;$("#ov").style.display="flex"}function close(){$("#ov").style.display="none"}
function roll(){if(busy)return;busy=true;$("#roll").disabled=true;const F="⚀⚁⚂⚃⚄⚅",d=$("#dice");let n=0,iv=setInterval(()=>{d.textContent=F[Math.floor(Math.random()*6)];if(++n>8){clearInterval(iv);const v=1+Math.floor(rnd()*6);d.textContent=F[v-1];setTimeout(()=>move(v),300)}},70)}
function move(s){const p=P[cur];if(s==0)return land();p.pos=(p.pos+1)%20;if(p.pos==0){const w=200+100*p.skill+60*p.biz;p.cash+=w;p.comm+=1;pay=`<div class="why">💵 <b>Payday!</b> You earned $${w} and paid taxes (+1 ❤️). More skill and more shops mean a bigger wage.</div>`}render();setTimeout(()=>move(s-1),250)}
const chips=f=>Object.entries({cash:["💰",""],comm:["❤️"," community"],skill:["🎓"," skill"],biz:["🏪"," shop"]}).filter(([k])=>f[k]).map(([k,v])=>`<span class="chip ${f[k]<0?"neg":""}">${v[0]} ${f[k]>0?"+":""}${f[k]}${v[1]}</span>`).join("")||"<small class=m>No change</small>";
function ap(f){const p=P[cur];p.cash+=f.cash||0;p.comm+=f.comm||0;p.skill=Math.min(3,p.skill+(f.skill||0));p.biz+=f.biz||0;render()}
function result(t,f,w,k){ap(f);if(k)P[0].k[k]+=f.comm||0;modal(`<h2>${t}</h2>${pay}<div>${chips(f)}</div>${k?`<small class=m>Topic: ${CN[k]}</small>`:""}<div class="why">📘 ${w}</div><button id="nx">Continue</button>`);pay="";$("#nx").onclick=()=>{close();endTurn()}}

const[h,d,o]=C[t[1]](p);
modal(`<h2>${h}</h2>${pay}<p>${d}</p>`+o.map((x,i)=>`<button class="o" data-i="${i}" ${x[3]||(x[1].cash<0&&p.cash+x[1].cash<0)?"disabled":""}>${x[0]}</button>`).join(""));
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{const x=o[b.dataset.i];result("✅ "+x[0].replace(/ \(.*|\s·.*/,""),x[1],x[2],KC[t[1]])})}
function endTurn(){P[cur].turns++;busy=false;push(P[0].turns>=R?1:0);if(P.every(p=>p.turns>=R))return fin();if(QZ[P[0].turns])return quiz(QZ[P[0].turns]);render()}

document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{const ok=+b.dataset.i==q[3];if(ok){p.q++;p.comm+=2;p.k[q[5]]+=2;push(0)}modal(`<h2>${ok?"✅ Correct! +2 ❤️":"❌ Not quite"}</h2><div class="why">📘 ${q[4]}</div><button id="nx">Continue</button>`);$("#nx").onclick=()=>{close();render()}})}
function fin(){const p=P[0],t=sc(p),rk=t>=40?"🌉 Bridge Builder":t>=30?"🏘️ Community Builder":t>=20?"🏠 Settler":"🧳 Newcomer",s=`${p.name}|${p.cash}|${p.comm}|${code}`,k=btoa(unescape(encodeURIComponent(s)))+"."+hs(s+"bw"),mx=Math.max(1,...Object.values(p.k)),ks=Object.entries(p.k).sort((a,b)=>a[1]-b[1]);
modal(`<h2>🏁 Journey complete</h2><div class="pc"><h3>${p.tok} ${esc(p.name)}: ${rk}</h3>💰 $${p.cash} (${p.cash/100} pts) · ❤️ ${p.comm} community · Quiz ${p.q}/4<br><b>Total score: ${t}</b></div><h3>Your impact by topic</h3>`+Object.keys(CN).map(c=>`<div>${CN[c]}: <b>${p.k[c]}</b><div style="background:#0002;border-radius:6px"><div style="height:8px;border-radius:6px;background:#8ecae6;width:${Math.max(0,p.k[c])/mx*100}%"></div></div></div>`).join("")+`<div class="why">📘 Strongest topic: <b>${CN[ks[3][0]]}</b>. Weakest: <b>${CN[ks[0][0]]}</b>. ${TK2[ks[0][0]]}</div><p>${DB?"✅ Your score is on the live leaderboard. Backup code:":"Give this <b>score code</b> to your host:"}</p><input readonly value="${k}" style="width:100%;padding:8px" onfocus="this.select()"><h3>Reflect</h3><ol>${RF.map(x=>`<li>${x}</li>`).join("")}</ol><button id="ag">Play again</button> <button id="hb">Leaderboard</button>`);$("#ag").onclick=()=>{close();seed(code);init();begin()};$("#hb").onclick=board}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function board(){DB?live():paste()}
function paste(){modal(`<h2>🏆 Paste score codes</h2><p>Game code: <input id="g2" value="${esc(code)}" style="padding:6px"></p><p>Paste one score code per line:</p><textarea id="ta" rows="6" style="width:100%"></textarea><button id="mk">Rank players</button> <button id="bk">Close</button><div id="out"></div>`);
$("#bk").onclick=close;
$("#mk").onclick=()=>{const g=$("#g2").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,""),rows=[];let bad=0;
$("#ta").value.split("\n").map(x=>x.trim()).filter(Boolean).forEach(l=>{try{const i=l.lastIndexOf("."),s=decodeURIComponent(escape(atob(l.slice(0,i))));if(hs(s+"bw")!=l.slice(i+1))throw 0;const[n,c,m,q]=s.split("|");if(q!=g)throw 0;rows.push({n,c:+c,m:+m,t:+c/100+ +m})}catch(e){bad++}});

function show(rows,bad=0){rows.sort((a,b)=>b.t-a.t);const f=rows.filter(r=>r.d!==0),av=f.reduce((a,r)=>a+r.t,0)/(f.length||1),best=(l,g)=>l.reduce((a,r)=>!a||g(r)>g(a)?r:a,null),bal=best(f.filter(r=>r.t>=av),r=>-Math.abs(r.c/100-r.m)),aw=[["🥇 Overall Champion",f[0]],["💰 Wealth Builder",best(f,r=>r.c)],["❤️ Community Builder",best(f,r=>r.m)],["⚖️ Best Balance",bal]].filter(a=>a[1]);
$("#out").innerHTML=(bad?`<p>⚠️ ${bad} invalid code(s) skipped.</p>`:"")+(aw.length?aw.map(a=>`<div class="why"><b>${a[0]}</b>: ${esc(a[1].n)}</div>`).join(""):"<small class=m>Awards appear when players finish.</small>")+"<table style='width:100%'><tr><th>#</th><th>Name</th><th>💰</th><th>❤️</th><th>Score</th><th></th></tr>"+rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>$${r.c}</td><td>${r.m}</td><td><b>${Math.round(r.t*10)/10}</b></td><td>${r.d===0?"R"+r.r+"/"+R:"✅"}</td></tr>`).join("")+"</table>"}

function live(){modal(`<h2>🏆 Live leaderboard</h2><p>Game code: <input id="g2" value="${esc(code)}" style="padding:6px"> <small id="st"></small></p><div id="out">Loading…</div><button id="bk">Close</button> <button id="pp">Paste codes instead</button>`);
const go=async()=>{if(!$("#out"))return clearInterval(iv2);try{const g=$("#g2").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,""),o=await(await fetch(`${DB}/games/${g}.json`)).json();$("#st").textContent="updated "+new Date().toLocaleTimeString();show(Object.values(o||{}).map(x=>({n:String(x.n||"?").slice(0,20),c:+x.c||0,m:+x.m||0,r:+x.r||0,d:x.d?1:0,t:(+x.c||0)/100+(+x.m||0)})))}catch(e){$("#out").textContent="⚠️ Can't reach the database. Check the DB URL and rules."}};
clearInterval(iv2);go();iv2=setInterval(go,3000);
$("#bk").onclick=()=>{clearInterval(iv2);close()};$("#pp").onclick=()=>{clearInterval(iv2);paste()}}
{const q=new URLSearchParams(location.search);if(q.get("game"))code=q.get("game").toUpperCase().replace(/[^A-Z0-9_-]/g,"")||"BRIDGE";init();q.get("view")=="board"&&DB?live():intro()}
</script></body></html>
